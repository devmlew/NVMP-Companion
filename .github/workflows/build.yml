name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build nvmp_companion
      run: |
        cd nvmp_companion
        cmake -B build -G "Visual Studio 17 2022" -A Win32
        cmake --build build --config Release

    - name: Build nvmp_server_hook
      run: |
        cd nvmp_server_hook
        cmake -B build -G "Visual Studio 17 2022" -A Win32
        cmake --build build --config Release

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nvmp-companion-release
        path: |
          nvmp_companion/build/bin/Release/nvmp_companion.dll
          nvmp_server_hook/build/bin/Release/nvmp_server_hook.dll
          nvmp_server_hook/build/bin/Release/nvmp_inject.exe
          mcm/NVMPCompanion.json
